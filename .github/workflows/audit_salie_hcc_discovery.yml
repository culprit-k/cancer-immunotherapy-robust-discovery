name: Audit Salié HCC development cohort
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_salie_hcc_discovery_archive.py"
      - ".github/workflows/audit_salie_hcc_discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-hcc-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install --upgrade pip requests
      - name: Download, verify and inspect licensed metadata
        run: python scripts/audit_salie_hcc_discovery_archive.py --output "$RUNNER_TEMP/salie-hcc-discovery-audit.json"
      - name: Upload metadata-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: salie-hcc-discovery-metadata-audit
          path: ${{ runner.temp }}/salie-hcc-discovery-audit.json
          if-no-files-found: error
          retention-days: 30
