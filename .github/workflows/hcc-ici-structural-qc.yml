name: HCC ICI archive structural QC (aggregate only)

on:
  workflow_dispatch:
  push:
    branches:
      - hcc-virtues-audit-next-step
    paths:
      - ".github/workflows/hcc-ici-structural-qc.yml"
      - "scripts/audit_hcc_ici_structural_archive.py"

permissions:
  contents: read

jobs:
  audit-public-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install structural QC dependencies
        run: python -m pip install --upgrade numpy pandas openpyxl tifffile

      - name: Download public ICI archive to ephemeral runner storage
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://zenodo.org/records/10794904/files/HCC_ICICohort.zip?download=1" \
            -o /tmp/HCC_ICICohort.zip
          actual="$(md5sum /tmp/HCC_ICICohort.zip | awk '{print $1}')"
          expected="d0b3242740b70c1355f67bc7bd176c6a"
          echo "Archive bytes: $(stat -c '%s' /tmp/HCC_ICICohort.zip)"
          echo "Archive MD5: $actual"
          test "$actual" = "$expected"

      - name: Audit all image and mask stacks; save aggregate-only report
        run: |
          python scripts/audit_hcc_ici_structural_archive.py \
            --archive /tmp/HCC_ICICohort.zip \
            --out /tmp/hcc_ici_structural_qc_summary.json

      - name: Upload aggregate-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcc-ici-aggregate-structural-qc
          path: /tmp/hcc_ici_structural_qc_summary.json
          if-no-files-found: warn
