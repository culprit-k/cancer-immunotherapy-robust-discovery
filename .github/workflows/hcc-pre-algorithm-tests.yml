name: HCC pre-algorithm metadata-gate tests

on:
  push:
    branches:
      - hcc-virtues-audit-next-step
  pull_request:

jobs:
  metadata-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install panel-validator dependencies
        run: python -m pip install pandas openpyxl
      - name: Compile local QC scripts
        run: |
          python -m py_compile scripts/validate_hcc_manifest.py scripts/hcc_tensor_qc.py scripts/hcc_preinference_preflight.py scripts/hcc_reconstruction_pilot_gate.py scripts/validate_hcc_panel.py scripts/validate_hcc_roi_crosswalk.py scripts/audit_hcc_roi_clinical_manifest.py scripts/verify_virtues_checkpoint.py scripts/run_hcc_local_gates.py
          bash -n scripts/bootstrap_hcc_public_data.sh
      - name: Run metadata-validator unit tests
        run: |
          python -m unittest discover -s tests -p 'test_validate_hcc_manifest.py' -v
          python -m unittest discover -s tests -p 'test_validate_hcc_panel.py' -v
          python -m unittest discover -s tests -p 'test_validate_hcc_roi_crosswalk.py' -v
          python -m unittest discover -s tests -p 'test_audit_hcc_roi_clinical_manifest.py' -v
          python -m unittest discover -s tests -p 'test_verify_virtues_checkpoint.py' -v
