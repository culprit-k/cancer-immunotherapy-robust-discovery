name: HCC pre-algorithm metadata-gate tests

on:
  push:
    branches:
      - hcc-virtues-audit-next-step
  pull_request:

jobs:
  metadata-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile local QC scripts
        run: |
          python -m py_compile scripts/validate_hcc_manifest.py scripts/hcc_tensor_qc.py scripts/hcc_preinference_preflight.py scripts/hcc_reconstruction_pilot_gate.py
          bash -n scripts/bootstrap_hcc_public_data.sh
      - name: Run metadata-validator unit tests
        run: python -m unittest discover -s tests -p 'test_validate_hcc_manifest.py' -v
