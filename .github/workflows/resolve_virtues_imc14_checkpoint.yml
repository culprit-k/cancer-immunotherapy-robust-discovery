name: Resolve VirTues IMC14 checkpoint
on:
  push:
    branches: [main]
    paths:
      - "scripts/resolve_virtues_imc14_checkpoint.py"
      - ".github/workflows/resolve_virtues_imc14_checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face client
        run: python -m pip install --upgrade pip huggingface_hub
      - name: Download official IMC14 file and hash it
        run: python scripts/resolve_virtues_imc14_checkpoint.py --output "$RUNNER_TEMP/virtues-imc14-checkpoint.json"
      - name: Upload checkpoint manifest only
        uses: actions/upload-artifact@v4
        with:
          name: virtues-imc14-checkpoint-manifest
          path: ${{ runner.temp }}/virtues-imc14-checkpoint.json
          if-no-files-found: error
          retention-days: 30
