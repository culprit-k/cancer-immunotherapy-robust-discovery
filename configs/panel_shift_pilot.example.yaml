foundation_model:
  name: "VirTues"
  repository_url: "https://github.com/bunnelab/virtues"
  checkpoint_id_or_hash: "bunnelab/virtues:virtues-imc14/model.safetensors@43fd00fce052c46f9e0cc1a87f42806620632319;sha256=714efed862f4a4b5cfd13f91e1ab8a7589f1295bd1735f827b4f8d4806cde28f"
  checkpoint_repository_revision: "43fd00fce052c46f9e0cc1a87f42806620632319"
  checkpoint_file_sha256: "714efed862f4a4b5cfd13f91e1ab8a7589f1295bd1735f827b4f8d4806cde28f"
  checkpoint_file_size_bytes: 173543728
  checkpoint_retrieved_at_utc: "2026-10-25T13:10:07.676504+00:00"
  checkpoint_manifest_action_run: "https://github.com/culprit-k/cancer-immunotherapy-robust-discovery/actions/runs/40196348184"
  model_license: "CC BY-NC 4.0 weights; non-commercial only"
  training_cohort_manifest_url: "https://www.nature.com/articles/s41586-026-10884-y; published 14-IMC versus extended-32 cohort inventory; exact exposure still needs confirmation"
  evaluation_cohort_exposure: "published_inventory_suggests_excluded; accession-level exposure unconfirmed" # Resolve against exact artifact before independent-test claim.

splits:
  grouping_unit: "patient"
  outer_test_fraction: 0.20
  validation_fraction_of_development_patients: 0.20
  nested_cells_cores_tiles_stay_with_patient: true
  split_manifest_path: "data/derived/patient_split.csv"

marker_masking:
  primary: "whole_channel"
  scenarios:
    - name: "single_channel"
      channels: ["CHANGE_ME"]
    - name: "panel_shift"
      channels: ["CHANGE_ME", "CHANGE_ME"]
  cellwise_random_masking_is_secondary_only: true

conditions:
  - "fully_measured_reference"
  - "reduced_panel_without_imputation"
  - "simple_imputation"
  - "foundation_model_reconstruction"

counterfactual_discovery:
  baseline_method: "CHANGE_ME"
  baseline_version_or_commit: "CHANGE_ME"
  objective: "predicted_CD8_infiltration"
  target_budget: 3
  allowed_target_markers: ["CHANGE_ME"]
  direction_encoding:
    increase: 1
    decrease: -1
  selection_uses_outer_test_data: false

evaluation:
  primary_unit: "patient"
  report_patient_macro_marker_error: true
  report_pooled_cell_error_as_secondary: true
  report_signed_target_set_fidelity: true
  report_direction_flip_rate: true
  report_patient_level_model_predicted_uplift_fidelity: true
  report_model_based_reference_regret: true
  confidence_intervals: "patient_level_bootstrap"
  bootstrap_replicates: 2000
  compare_all_conditions_on_same_outer_test_patients: true

guardrails:
  full_measurement_is_model_reference_not_biological_truth: true
  predicted_uplift_is_not_observed_treatment_effect: true
  no_raw_data_committed_to_public_repository: true
  no_novelty_or_patentability_claim_before_prior_art_gate: true
